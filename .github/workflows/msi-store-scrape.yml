name: MSI Store 活動蒐集

on:
  schedule:
    # 每天台北時間 09:00（UTC 01:00）
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python msi-store-tracker/scrape_msi_store.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add msi-store-tracker/reports msi-store-tracker/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: MSI Store 活動蒐集 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
